<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css" />

  <title>Faça seu cadastro - Sujeitogram</title>
</head>
<body>
  <main id="wrapper">
    
    <!-- AREA CONTAINER -->
    <section id="container-signup">

      <!-- AREA DIREITA -->
      <section class="column">
        <section class="login-panel">
          <figure class="logo">
            <img class="logo-img" src="assets/logo.png" alt="Logo do Sujeitogram">
          </figure>

          <p class="message">Cadastre-se para ver fotos e vídeos dos seus amigos.</p>

          <button class="cta-button">
            Entrar com Facebook
          </button>

          <section class="divisor-container" aria-hidden="true">
            <hr class="line">
            <span class="divisor-tag">ou</span>
            <hr class="line">
          </section>

          <form>
            <input placeholder="Número de celular ou email" type="text" name="email"/>
            <input placeholder="Nome completo" type="text" name="name"/>
            <input placeholder="Username" type="text" name="username"/>
            <input placeholder="Senha" type="password" name="password" />

            <input type="submit" value="Entrar" />
          </form>
        </section>

        <aside class="infobox">
          <p>Tem uma conta? <a href="index.html">Conecte-se</a> </p>
        </aside>

        <section class="get-app-panel">
          Obtenha o aplicativo.
          <nav class="app-buttons" aria-label="Links de loja">
            <a href="#">
              <img src="assets/appstore.png" alt="Baixe na AppStore">
            </a>
            <a href="#">
              <img src="assets/googleplay.png" alt="Baixe na Googleplay">
            </a>
          </nav>
        </section>

      </section>
      <!-- FIM AREA DIREITA -->

    </section>
    <!-- FIM AREA CONTAINER -->

    <!-- RODAPE -->
    <footer>
      <nav class="footer-inner" aria-label="Links do rodapé">
        <a href="#">About us</a>
        <a href="#">Support</a>
        <a href="#">Blog</a>
        <a href="#">Press</a>
        <a href="#">API</a>
        <a href="#">Jobs</a>
        <a href="#">Privacy</a>
        <a href="#">Terms</a>
        <a href="#">Directory</a>
        <a href="#">Profiles</a>
        <a href="#">Hashtags</a>
        <a href="#">Language</a>
        <span class="text-small">@ 2022 Instagram</span>
      </nav>
    </footer>

  </main>

</body>
</html>
