<!DOCTYPE html>
<html lang="pt-br">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <article class="column left">
            <h1>Minha conta</h1>
            <form action="#">
                <div class="form-group">
                    <input type="email" value="Digite seu email">
                    <input type="password" value="Digite sua senha">
                    <button type="submit">Acessar</button>
                </div>
                <p><strong>Novo por aqui?</strong> <a href="#">Cadastre-se</a></p>
            </form>
        </article>

        <article class="column right">
            <img src="assets/info.png" alt="Diagrama">
            <h2>Leve sua carreira ao próximo nível.</h2>

</html>
